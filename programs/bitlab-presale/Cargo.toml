[package]
name = "bitlab-presale"
version = "1.0.0"
description = "BitLab Coin Presale program — Solana. Immediate BITLAB delivery, 10 time-based rounds, 7.5B cap."
edition = "2021"
rust-version = "1.79"
license = "UNLICENSED"

[package.metadata.solana]
tools-version = "v1.52"

[lib]
crate-type = ["cdylib", "lib"]
name = "bitlab_presale"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
solana-security-txt = "1.1.1"
zeroize = "=1.8.1"
zeroize_derive = "=1.4.2"
